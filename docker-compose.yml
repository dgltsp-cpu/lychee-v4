services:
  lychee:
    image: ghcr.io/dgltsp-cpu/lychee-v4:v4.12.0-nobrand
    container_name: lychee-v4
    restart: always
    ports:
      - "${LYCHEE_PORT:-8082}:80"
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=sqlite
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - lychee_conf:/conf
      - lychee_uploads:/uploads

volumes:
  lychee_conf:
  lychee_uploads:
